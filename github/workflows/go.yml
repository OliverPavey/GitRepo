name: Build/Test Go Artifacts
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version: '1.22.1'
      - name: Install dependencies
        run: go get .
      - name: Build
        run: bash build.sh
      # - name: Test
      #   run: bash test.sh
      - name: Upload artifact windows amd64
        uses: actions/upload-artifact@v6
        with:
          name: gitrepo-windows-amd64
          path: bin/windows/amd64/gitrepo.exe
          retention-days: 90
      - name: Upload artifact linux amd64
        uses: actions/upload-artifact@v6
        with:
          name: gitrepo-linux-amd64
          path: bin/linux/amd64/gitrepo
          retention-days: 90
